name: Go

on:
  push:
    paths-ignore:
      - packaging/**
      - openapi/**
      - '**/*.md'
      - '.github/ISSUE_TEMPLATE/**'
    branches:
      - 'master'
  # No paths-ignore on pull_request: the required checks below must always
  # report. Docs-only PRs are detected by the changes job and skip the work.
  pull_request:
    branches:
      - '**'

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      # 'false' only for a pull request touching nothing but ignored paths.
      code: ${{ github.event_name != 'pull_request' || steps.filter.outputs.code == 'true' }}
    steps:
    - name: Detect code changes
      id: filter
      if: github.event_name == 'pull_request'
      uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
      with:
        predicate-quantifier: every
        filters: |
          code:
            - '!packaging/**'
            - '!openapi/**'
            - '!**/*.md'
            - '!.github/ISSUE_TEMPLATE/**'
  test:
    name: Test
    needs: [changes]
    # A matrix job skipped at job level is not expanded, so the required
    # "Test (<os>)" checks would never report. Always run the matrix and
    # gate the steps instead. Runs everything if changes did not succeed.
    if: ${{ !cancelled() }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      RUN_CHECKS: ${{ needs.changes.outputs.code != 'false' }}
    steps:
    - name: Skip (no code changes)
      if: env.RUN_CHECKS != 'true'
      run: echo "Only ignored paths changed, skipping build and tests."
    - name: Checkout
      if: env.RUN_CHECKS == 'true'
      uses: actions/checkout@v5
    - name: Setup Go
      if: env.RUN_CHECKS == 'true'
      uses: actions/setup-go@v6
      with:
        cache: true
        go-version-file: go.mod
    - name: Increase UDP buffer sizes (Ubuntu)
      if: env.RUN_CHECKS == 'true' && matrix.os == 'ubuntu-latest'
      run: |
        sudo sysctl -w net.core.rmem_max=7500000
        sudo sysctl -w net.core.wmem_max=7500000
    - name: Increase UDP buffer sizes (macOS)
      if: env.RUN_CHECKS == 'true' && matrix.os == 'macos-latest'
      run: |
        sudo sysctl -w kern.ipc.maxsockbuf=6291456
    - name: Build
      if: env.RUN_CHECKS == 'true'
      run: make build
    - name: Test with race detector (Ubuntu and MacOS)
      if: env.RUN_CHECKS == 'true' && matrix.os != 'windows-latest'
      run: make test-ci-race
    - name: Test without race detector (Windows)
      if: env.RUN_CHECKS == 'true' && matrix.os == 'windows-latest'
      run: make test-ci
  lint:
    name: Lint
    needs: [changes]
    # Skipped jobs report success to required status checks.
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v5
      with:
        fetch-depth: 0
    - name: Setup Go
      uses: actions/setup-go@v6
      with:
        cache: false
        go-version-file: go.mod
    - name: Commit linting
      if: github.ref != 'refs/heads/master'
      uses: wagoid/commitlint-github-action@v5
      with:
        configFile: commitlint.config.js
    - name: GolangCI-Lint
      uses: golangci/golangci-lint-action@1e7e51e771db61008b38414a730f564565cf7c20 # v9.2.0
      with:
        # Disable the golangci-lint cache: a restored stale cache has produced
        # phantom staticcheck findings in files unrelated to the PR diff. The
        # full lint run is fast enough that correctness is worth the trade-off.
        skip-cache: true
        version: v2.11.3
    - name: Whitespace check
      run: make check-whitespace
    - name: go mod tidy check
      uses: katexochen/go-tidy-check@v2
  coverage:
    name: Coverage Report
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v5
    - name: Setup Go
      uses: actions/setup-go@v6
      with:
        cache: false
        go-version-file: go.mod
    - name: Cache Go Modules
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ runner.os }}-go-coverage-${{ hashFiles('**/go.sum') }}
    - name: Test with code coverage
      run: make cover=1 test-ci
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: true
        files: ./cover.out
  trigger-beekeeper:
    name: Trigger Beekeeper
    runs-on: ubuntu-latest
    needs: [test, lint, coverage]
    if: github.ref == 'refs/heads/master'
    steps:
    - name: Checkout
      uses: actions/checkout@v5
      with:
        fetch-depth: 0
    - name: Setup Go
      uses: actions/setup-go@v6
      with:
        cache: false
        go-version-file: go.mod
    - name: Trigger Beekeeper
      uses: peter-evans/repository-dispatch@v2
      with:
        token: ${{ secrets.GHA_PAT_BASIC }}
        repository: ${{ github.repository }}
        event-type: trigger-beekeeper
        client-payload: '{"ref": "${{ github.ref }}", "sha": "${{ github.sha }}"}'
